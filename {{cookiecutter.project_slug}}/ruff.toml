# Ruff configuration file
# This file provides additional Ruff-specific settings

line-length = 100
target-version = "py311"

# Enable additional rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RUF", # Ruff-specific rules
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "N",   # pep8-naming
    "WPS", # wemake-python-styleguide
]

ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "S101",  # use of assert (allowed in tests)
    "T201",  # print statements (allowed in CLI)
    "PLR0913", # too many arguments
    "PLR2004", # magic value
    "WPS111", # too short variable name
    "WPS110", # too short module name
]

# Per-file ignores
[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # unused imports, star imports
"tests/*" = ["ARG", "S101", "PLR2004", "S106", "S108"]  # allow assert, unused arguments, magic values, hardcoded passwords in tests
"alembic/*" = ["F401", "F403"]  # unused imports, star imports in migrations
"scripts/*" = ["T201", "S603", "S607"]  # allow print, subprocess calls in scripts
"cli/*" = ["T201"]  # allow print in CLI

# Isort configuration
[tool.ruff.isort]
known-first-party = ["app"]
force-sort-within-sections = true
split-on-trailing-comma = true

# Quote style
[tool.ruff.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

# Pylint configuration
[tool.ruff.pylint]
max-args = 7
max-branches = 12
max-returns = 6
max-statements = 50
