[tool.poetry]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_description }}"
authors = ["{{ cookiecutter.author_name }} <{{ cookiecutter.author_email }}>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^{{ cookiecutter.python_version }}"
flask = "^3.0.0"
flask-sqlalchemy = "^3.1.1"
sqlalchemy = "^2.0.23"
alembic = "^1.13.0"
pyodbc = "^5.0.1"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
structlog = "^24.1.0"
dynaconf = "^3.2.4"
click = "^8.1.7"
{% if cookiecutter.use_redis == "y" %}
redis = "^5.0.1"
{% endif %}
{% if cookiecutter.use_websocket == "y" %}
flask-socketio = "^5.3.6"
python-socketio = "^5.10.0"
eventlet = "^0.33.3"
{% endif %}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-flask = "^1.3.0"
black = "^23.12.1"
ruff = "^0.1.9"
mypy = "^1.7.1"
pre-commit = "^3.6.0"
bandit = "^1.7.6"
safety = "^2.3.5"

[tool.poetry.scripts]
cli = "cli.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RUF", # Ruff-specific rules
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "N",   # pep8-naming
    "WPS", # wemake-python-styleguide
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "S101",  # use of assert (allowed in tests)
    "T201",  # print statements (allowed in CLI)
    "PLR0913", # too many arguments
    "PLR2004", # magic value
    "WPS111", # too short variable name
    "WPS110", # too short module name
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # unused imports, star imports
"tests/*" = ["ARG", "S101", "PLR2004", "S106", "S108"]  # allow assert, unused arguments, magic values, hardcoded passwords in tests
"alembic/*" = ["F401", "F403"]  # unused imports, star imports in migrations
"scripts/*" = ["T201", "S603", "S607"]  # allow print, subprocess calls in scripts
"cli/*" = ["T201"]  # allow print in CLI

[tool.ruff.isort]
known-first-party = ["app"]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.pylint]
max-args = 7
max-branches = 12
max-returns = 6
max-statements = 50

[tool.mypy]
python_version = "{{ cookiecutter.python_version }}"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "flask.*",
    "flask_sqlalchemy.*",
    "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "alembic/versions"]
skips = ["B101", "B601"]

